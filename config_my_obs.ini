[OBS]
# OBS WebSocket connection settings
# Change these to match your OBS setup
host = localhost
port = 4455
password = 

[SCENE_MAPPING]
# Map scripture readings to YOUR OBS scenes and text sources
# Format: reading_type = YOUR_SCENE_NAME:YOUR_TEXT_SOURCE_NAME
# 
# CUSTOMIZE THESE to match your actual OBS scene and source names:

# First Reading
first_reading_text = MY_LITURGY_SCENE:MY_FIRST_READING_TEXT
first_reading_reference = MY_LITURGY_SCENE:MY_FIRST_READING_REF

# Responsorial Psalm  
psalm_text = MY_LITURGY_SCENE:MY_PSALM_TEXT
psalm_reference = MY_LITURGY_SCENE:MY_PSALM_REF

# Second Reading (if used)
second_reading_text = MY_LITURGY_SCENE:MY_SECOND_READING_TEXT
second_reading_reference = MY_LITURGY_SCENE:MY_SECOND_READING_REF

# Gospel
gospel_text = MY_LITURGY_SCENE:MY_GOSPEL_TEXT
gospel_reference = MY_LITURGY_SCENE:MY_GOSPEL_REF

# Gospel Acclamation
gospel_acclamation = MY_LITURGY_SCENE:MY_GOSPEL_ACCLAMATION

# The Collect (Prayer of the Day)
collect = MY_LITURGY_SCENE:MY_COLLECT_TEXT

[FORMATTING]
# Text formatting options
max_text_length = 500
include_verse_numbers = true
line_break_on_verses = false

[API]
# Episcopal liturgical calendar API settings
primary_source = The Lectionary Page (Episcopal RCL)
base_url = https://www.lectionarypage.net
fallback_url = https://lectionary.library.vanderbilt.edu
timeout = 10
liturgical_tradition = Episcopal
lectionary_cycle = Revised Common Lectionary