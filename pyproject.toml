[project]
name = "liturgical-calendar-web"
version = "1.2.0"
description = "Daily Liturgical Scripture Calendar with OBS Integration - Episcopal Church liturgical readings from the Revised Common Lectionary"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "flask>=3.1.1",
    "obsws-python>=1.8.0",
    "opencv-python>=4.12.0.88",
    "pdfplumber>=0.11.7",
    "pillow>=11.3.0",
    "pypdf2>=3.0.1",
    "pytesseract>=0.3.13",
    "requests>=2.32.4",
    "trafilatura>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["templates*", "uploads*", "*.egg-info*", "__pycache__*", "tests*"]
