[project]
name = "liturgical-calendar-web"
version = "0.1.0"
description = "Daily Liturgical Scripture Calendar with OBS Integration - Episcopal Church liturgical readings from the Revised Common Lectionary"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "flask>=3.1.1",
    "obsws-python>=1.8.0",
    "requests>=2.32.4",
    "trafilatura>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
